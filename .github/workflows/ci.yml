name: Flight Optimizer CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Unit tests - scoring engine
        run: pytest test_scoring.py -v

      - name: Integration tests - API endpoints
        env:
          OPENSKY_USE_MOCK_STATES: "1"
        run: pytest test_backend.py -v

      - name: Fuzz tests - boundary values
        run: pytest test_fuzz.py -v --hypothesis-seed=0
